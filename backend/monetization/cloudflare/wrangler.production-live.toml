# Explicit live configuration after owner-confirmed real-payment delivery, 2026-10-16.
# Uses the existing production resource identity, not the staging database.
name = "jade-ascendant-iap"
main = "src/worker_paid_production_v2.mjs"
compatibility_date = "2026-09-01"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[vars]
JADE_REAL_MONEY_RELEASE_ENABLED = "true"
JADE_PAID_GAMEPLAY_V2_ENABLED = "true"
JADE_STAGING_ACCOUNT_GUARD = "false"
JADE_IAP_BACKEND_ENABLED = "true"
JADE_PAID_WALLET_READ_ENABLED = "true"
JADE_SUMMON_RECOVERY_READ_ENABLED = "false"
JADE_PAID_WALLET_CREDIT_V2_ENABLED = "true"
JADE_PAID_SUMMON_WRITE_ENABLED = "false"
JADE_PAID_ENTITLEMENTS_READ_ENABLED = "false"
JADE_PAID_LOADOUT_READ_ENABLED = "false"
JADE_PAID_LOADOUT_WRITE_ENABLED = "false"
JADE_TRUSTED_PROGRESSION_READ_ENABLED = "false"
JADE_SUMMON_RECOVERY_INDEX_READ_ENABLED = "false"
JADE_REFUND_RECONCILIATION_READY = "true"
JADE_PAID_SUMMON_PURCHASE_UNLOCK_ENABLED = "false"
FIREBASE_PROJECT_ID = "jade-ascendant"
FIREBASE_PROJECT_NUMBER = "350718070767"
JADE_ANDROID_FIREBASE_APP_ID = "1:350718070767:android:e5520012a501d2856cf01a"

JADE_CANONICAL_ONBOARDING_RC12_ENABLED = "true"

JADE_REFUND_CRON_JOB_RC7_ENABLED = "true"

JADE_REFUND_RTDN_PUSH_RC9_ENABLED = "false"

JADE_VERIFIED_PURCHASE_REPAIR_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "jade-iap-ledger"
database_id = "f0e59ec4-effb-4002-b9a5-d246965b5b83"
migrations_dir = "migrations"

# Refund polling remains required for production checkout.
[triggers]
crons = ["*/15 * * * *"]

[[services]]
binding = "ODYSSEY_PROFILE"
service = "jade-ascendant-player"
