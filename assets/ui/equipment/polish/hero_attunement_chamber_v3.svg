  <g fill="none" stroke="#3ddac9" stroke-opacity="0.09" stroke-width="2">
    <path d="M324 790L96 1128M324 790l228 338"/>
    <path d="M324 790L197 1152M324 790l127 362"/>
    <path d="M58 906h532M84 1002h480M126 1087h396"/>
