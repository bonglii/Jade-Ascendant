  <g opacity="0.94">
    <path d="M0 88h92l24 34v708L88 866H0z" fill="url(#pillar)"/>
    <path d="M648 88h-92l-24 34v708l28 36h88z" fill="url(#pillar)"/>
    <path d="M20 108h52l17 21v670l-18 24H20z" fill="#082d37" opacity="0.78" stroke="#cda143" stroke-opacity="0.62" stroke-width="2"/>
    <path d="M628 108h-52l-17 21v670l18 24h51z" fill="#082d37" opacity="0.78" stroke="#cda143" stroke-opacity="0.62" stroke-width="2"/>
