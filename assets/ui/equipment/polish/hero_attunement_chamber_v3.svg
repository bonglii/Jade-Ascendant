  <path d="M78 148C142 48 227 19 324 19s182 29 246 129" fill="none" stroke="#103e48" stroke-width="44" opacity="0.85"/>
  <path d="M82 149C145 59 230 31 324 31s179 28 242 118" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.80"/>
  <path d="M107 156C166 82 241 58 324 58s158 24 217 98" fill="none" stroke="#4aeee0" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="10 15"/>
  <path d="M324 24l15 19-15 18-15-18z" fill="#f1cd66" opacity="0.92"/>
  <circle cx="324" cy="43" r="7" fill="#52ead8" opacity="0.70"/>

  <!-- central attunement portal -->
  <ellipse cx="324" cy="430" rx="202" ry="270" fill="#0f9389" opacity="0.035"/>
  <ellipse cx="324" cy="430" rx="188" ry="248" fill="none" stroke="#52ead8" stroke-opacity="0.14" stroke-width="2"/>
  <ellipse cx="324" cy="430" rx="162" ry="220" fill="none" stroke="#f0c65a" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="18 13"/>
  <ellipse cx="324" cy="430" rx="139" ry="194" fill="none" stroke="#59f5df" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 10"/>
  <path d="M324 197l18 24-18 18-18-18zM324 665l18-24-18-18-18 18zM128 430l24-18 18 18-18 18zM520 430l-24-18-18 18 18 18z" fill="#e6bd55" opacity="0.55"/>

  <!-- orbit traces that visually bind equipment sockets -->
  <path d="M118 331C177 233 251 200 324 200s147 33 206 131" fill="none" stroke="#6af2df" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M104 542C170 632 247 666 324 666s154-34 220-124" fill="none" stroke="#e8bf57" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M133 285C208 378 217 532 148 610" fill="none" stroke="#6af2df" stroke-opacity="0.09" stroke-width="2"/>
  <path d="M515 285C440 378 431 532 500 610" fill="none" stroke="#6af2df" stroke-opacity="0.09" stroke-width="2"/>

  <!-- side talisman banners, intentionally non-textual -->
  <g opacity="0.52" fill="#082a34" stroke="#b98b2d" stroke-width="2">
    <path d="M77 202h38l12 14v166l-31 29-31-29V216z"/>
    <path d="M533 202h38l12 14v166l-31 29-31-29V216z"/>
  </g>
  <g fill="none" stroke="#51e5d5" stroke-opacity="0.38" stroke-width="2">
    <path d="M91 240h10l-8 24 14 14-13 18 11 17-13 27"/>
    <path d="M557 240h-10l8 24-14 14 13 18-11 17 13 27"/>
  </g>

  <!-- lower altar and floor -->
  <path d="M0 760c114-42 215-58 324-58s210 16 324 58v392H0z" fill="url(#floor)"/>
  <ellipse cx="324" cy="744" rx="214" ry="54" fill="#28c8b5" opacity="0.08"/>
  <ellipse cx="324" cy="742" rx="184" ry="39" fill="none" stroke="url(#jade)" stroke-width="3" stroke-opacity="0.34"/>
