  <g fill="#64f0dd" opacity="0.13">
    <path d="M124 899l8 12-8 12-8-12z"/><path d="M524 899l8 12-8 12-8-12z"/>
    <path d="M191 1000l7 11-7 11-7-11z"/><path d="M457 1000l7 11-7 11-7-11z"/>
  </g>

  <!-- subtle corner ornaments -->
  <path d="M13 26h79M13 26v79M635 26h-79M635 26v79" fill="none" stroke="#e9c259" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M13 1126h79M13 1126v-79M635 1126h-79M635 1126v-79" fill="none" stroke="#32d6c4" stroke-opacity="0.30" stroke-width="2"/>
</svg>
