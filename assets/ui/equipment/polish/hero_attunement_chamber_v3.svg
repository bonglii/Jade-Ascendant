<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 1152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071f2f"/>
      <stop offset="0.38" stop-color="#052331"/>
      <stop offset="0.72" stop-color="#031922"/>
      <stop offset="1" stop-color="#010b12"/>
    </linearGradient>
    <radialGradient id="sanctum" cx="50%" cy="37%" r="58%">
      <stop offset="0" stop-color="#19bfae" stop-opacity="0.34"/>
      <stop offset="0.36" stop-color="#0f756f" stop-opacity="0.18"/>
      <stop offset="0.68" stop-color="#063c48" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#001017" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset="0.5" stop-color="#0c3540"/>
      <stop offset="1" stop-color="#031019"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#91fff0"/>
      <stop offset="0.48" stop-color="#2adbc7"/>
      <stop offset="1" stop-color="#087882"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7e5516"/>
      <stop offset="0.23" stop-color="#d2a33e"/>
      <stop offset="0.5" stop-color="#ffe6a0"/>
      <stop offset="0.77" stop-color="#d2a33e"/>
      <stop offset="1" stop-color="#7e5516"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0a3338" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#001118" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="stars" width="94" height="94" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="28" r="1.2" fill="#a5fff1" opacity="0.20"/>
      <circle cx="71" cy="53" r="1" fill="#f4d576" opacity="0.16"/>
      <circle cx="40" cy="82" r="0.8" fill="#72eadc" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="648" height="1152" fill="url(#bg)"/>
  <rect width="648" height="1152" fill="url(#sanctum)"/>
  <rect width="648" height="1152" fill="url(#stars)" opacity="0.72"/>

  <!-- distant celestial architecture -->
  <path d="M0 318L58 251l40 42 49-90 55 81 42-53 80 82 72-86 44 58 60-103 45 93 47-44 76 87v260H0z" fill="#0b3340" opacity="0.26"/>
  <path d="M0 375L78 315l46 42 66-56 61 71 76-96 62 86 50-38 78 73 52-49 59 58 20-14v250H0z" fill="#08262f" opacity="0.40"/>

