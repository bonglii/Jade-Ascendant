name: Library and Lin Yue QA
on:
  push:
    branches: ['checkpoint/**']
    paths: ['assets/character/player/**', 'assets/ui/library/**', 'scripts/player/**', 'scripts/ui/*library*', 'scripts/ui/skill_book_screen.gd', 'scripts/data/equipment_catalog.gd', 'tests/lin_yue_library_smoke.gd', '.github/workflows/library-lin-yue-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Godot project
        shell: bash
        run: |
          mkdir -p /tmp/jade-qa/project
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-qa/godot.zip
          unzip -q /tmp/jade-qa/godot.zip -d /tmp/jade-qa
          python3 - <<'PY'
          from pathlib import Path
          import re
          repo=Path.cwd();qa=Path('/tmp/jade-qa/project')
          for name in ['assets','scripts','scenes','tests','backend','addons']:(qa/name).symlink_to(repo/name,target_is_directory=True)
          s=(repo/'project.godot').read_text()
          s=re.sub(r'\[editor_plugins\][\s\S]*?(?=\n\[|\Z)','[editor_plugins]\nenabled=PackedStringArray()\n',s)
          for folder in ['scripts','addons']:
            for p in (repo/folder).rglob('*.gd.uid'):
              uid=p.read_text().strip()
              if uid in s:s=s.replace(uid,'res://'+str(p.relative_to(repo)).removesuffix('.uid'))
          (qa/'project.godot').write_text(s)
          PY
          timeout 600 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/jade-qa/project --editor --import
      - name: Library, locomotion and combat regression
        shell: bash
        run: |
          XDG_DATA_HOME=/tmp/jade_lin_library_qa timeout 180 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/jade-qa/project --script res://tests/lin_yue_library_smoke.gd
          XDG_DATA_HOME=/tmp/jade_combat_pass_qa_lin timeout 180 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/jade-qa/project --script res://tests/combat_skill_polish_smoke.gd
          XDG_DATA_HOME=/tmp/jade_arsenal_qa_integration_lin timeout 180 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/jade-qa/project --script res://tests/arsenal_integration_smoke.gd
