name: Heavenly Trials integration
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['scripts/**/heavenly_trial*', 'scripts/ui/liveops/heavenly_trials_screen.gd', 'scripts/ui/pavilion_sanctum_screen.gd', 'scripts/monetization/**', 'backend/**/heavenly_trials*', 'backend/monetization/cloudflare/src/paid_gameplay_v2.mjs', 'backend/player_identity/check_heavenly_trials.cjs', 'tests/heavenly_trials*', '.github/workflows/heavenly-trials-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-mobile-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jade-trials-godot
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-trials-godot/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/jade-trials-godot/godot.zip' | sha256sum --check
          unzip -q /tmp/jade-trials-godot/godot.zip -d /tmp/jade-trials-godot
      - name: Weekly backend and actual mobile/runtime recovery
        run: node backend/player_identity/check_heavenly_trials.cjs "$GITHUB_WORKSPACE" /tmp/jade-trials-godot/Godot_v4.7.2-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heavenly-trials-qa-${{ github.run_id }}
          path: |
            .local/heavenly_trials_qa/*.log
            .local/heavenly_trials_qa/*.json
            .local/event_touch_qa/*.log
            .local/event_touch_qa/*.json
          retention-days: 14
  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell launchers
        shell: powershell
        run: |
          foreach ($name in @('deploy_heavenly_trials.ps1','build_iap_production_candidate.ps1','verify_odyssey_aab.ps1')) {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ('backend/player_identity/'+$name)),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($name+': '+$errors[0].Message) }
          }
