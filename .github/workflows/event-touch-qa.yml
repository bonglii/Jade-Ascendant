name: Player flow and event surfaces
on:
  workflow_dispatch:
  push:
    branches: [checkpoint/iap-fasttrack-20261010]
    paths:
      - 'scripts/**'
      - 'assets/ui/liveops/**'
      - 'assets/ui/trials/**'
      - 'tests/**'
      - 'backend/player_identity/**'
      - 'backend/monetization/cloudflare/**'
      - '.github/workflows/event-touch-qa.yml'
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download verified Godot
        shell: bash
        run: |
          mkdir -p /tmp/jade-event-engine
          curl -fsSL --retry 2 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-event-engine/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/jade-event-engine/godot.zip' | sha256sum --check
          unzip -q /tmp/jade-event-engine/godot.zip -d /tmp/jade-event-engine
          chmod +x /tmp/jade-event-engine/Godot_v4.7.2-stable_linux.x86_64
      - name: Player flows, GUI gestures, narrow layouts and backend guards
        run: |
          node backend/player_identity/check_stage_records.cjs "$GITHUB_WORKSPACE" /tmp/jade-event-engine/Godot_v4.7.2-stable_linux.x86_64
          node backend/player_identity/check_player_flow.cjs "$GITHUB_WORKSPACE" --server-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-touch-qa
          path: |
            .local/event_touch_qa/*.log
            .local/player_flow_qa/*.log
            .local/stage_records_qa/*.log
