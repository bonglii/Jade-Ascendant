name: Combat Cel Polish QA
on:
  push:
    branches: ['checkpoint/**']
    paths: ['assets/effects/combat_cels/**', 'assets/shaders/hostile_cel_palette*', 'assets/weapons/sword/yin_yang_blades_spriteframes.tres', 'scripts/effects/combat*', 'scripts/enemy/**', 'scripts/weapon/**', 'scripts/ui/level_up.gd', 'scripts/data/skill_catalog.gd', 'tests/combat_cel*', 'tests/yin_yang_coverage_probe.gd', 'tests/check_combat_cel.cjs', '.github/workflows/combat-cel-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tests/combat_cel_asset_audit.py
      - name: Verified Godot engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jade-qa
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-qa/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/jade-qa/godot.zip' | sha256sum --check
          unzip -q /tmp/jade-qa/godot.zip -d /tmp/jade-qa
      - name: Targeted mechanics, real collision coverage and reports
        run: node tests/check_combat_cel.cjs "$PWD" /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-cel-${{ github.sha }}
          path: .local/combat_cel_recovery/*.*
          if-no-files-found: error
          retention-days: 14
