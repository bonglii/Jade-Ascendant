name: Jade Ascendant - Godot 4.7.2 QA

on:
  push:
    branches:
      - 'qa/**'
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-smoke:
    name: Godot 4.7.2 / PERIKSA_GAME
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact CI revision
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to resolve checked-out HEAD.'
          }
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checked out $actual but workflow SHA is $env:GITHUB_SHA"
          }
          Write-Host "EXACT_SHA_CI_PASS $actual"

      - name: Setup Node.js 22 for server-boundary tests
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run trusted-backend boundary QA (no Firebase deployment)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sources = @(
            'backend/cloud_save/functions/index.mjs',
            'backend/cloud_save/functions/src/read_only_policy.mjs',
            'backend/cloud_save/functions/src/callable_factory.mjs',
            'backend/cloud_save/tests/read_only_policy.test.mjs',
            'backend/cloud_save/tests/callable_factory.test.mjs'
          )
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node runtime is unavailable.' }
          foreach ($source in $sources) {
            node --check $source
            if ($LASTEXITCODE -ne 0) { throw "Backend syntax check failed: $source" }
          }
          node --test backend/cloud_save/tests/read_only_policy.test.mjs backend/cloud_save/tests/callable_factory.test.mjs backend/cloud_save/tests/predeploy_gate43.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Backend boundary regression failed." }

      - name: Download and verify official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Godot binary checksum mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $godot = Join-Path $installDir 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Official Godot console executable not found: $godot"
          }
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot --version failed.' }
          "JADE_GODOT_EXE=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run isolated production smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.\tools\windows.ps1' -Mode Check -GodotPath $env:JADE_GODOT_EXE
          if ($LASTEXITCODE -ne 0) {
            throw "PERIKSA_GAME failed with exit code $LASTEXITCODE. Inspect uploaded artifacts."
          }

      - name: Preserve QA evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jade-ascendant-godot-qa-${{ github.run_id }}
          path: |
            artifacts/check-*/import.log
            artifacts/check-*/smoke.log
            artifacts/check-*/summary.json
          if-no-files-found: warn
          retention-days: 14

  cloud-backend-runtime:
    name: Cloud Gate 4.1 / real SDK and emulator (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-jade-cloud-save-gate41
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      JADE_CLOUD_EMULATOR_TEST: '1'

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact CI revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$GITHUB_SHA" ]]; then
            echo "ERROR: checked out $actual but workflow SHA is $GITHUB_SHA" >&2
            exit 1
          fi
          echo "EXACT_SHA_CI_PASS $actual"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check backend tracked paths for local credentials and caches
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files backend/ | grep -Ei '(^|/)(node_modules|\.firebase)/|(^|/)(\.env($|\.)|[^/]*service.?account[^/]*\.json$|firebase-debug[^/]*|[^/]*\.keystore$|[^/]*\.jks$)' ; then
            echo 'ERROR: unexpected tracked backend credential/cache path' >&2
            exit 1
          fi

      - name: Install actual Firebase SDK (isolated backend only)
        shell: bash
        run: |
          set -euo pipefail
          # First Gate 4.1 run generates a reviewable candidate lockfile.
          # It is NOT yet committed/reproducible across future runs.
          if [[ ! -f backend/cloud_save/functions/package-lock.json ]]; then
            echo '::warning::Candidate lockfile generated in CI; review and commit it before marking dependency reproducibility PASS.'
            npm --prefix backend/cloud_save/functions install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm --prefix backend/cloud_save/functions ci --ignore-scripts --no-audit --no-fund

      - name: Preserve generated dependency lock evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jade-cloud-gate41-lock-${{ github.run_id }}
          path: backend/cloud_save/functions/package-lock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run boundary + actual SDK discovery tests
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            backend/cloud_save/tests/read_only_policy.test.mjs \
            backend/cloud_save/tests/callable_factory.test.mjs \
            backend/cloud_save/tests/real_sdk_loading.test.mjs \
            backend/cloud_save/tests/predeploy_gate43.test.mjs

      - name: Run Auth + Functions emulator boundary integration
        shell: bash
        run: |
          set -euo pipefail
          # Demo-only project; no login, firebase deploy, secrets, cloud billing,
          # Firestore Emulator, or write route. CLI version pinned for this gate.
          npx --yes firebase-tools@15.28.2 emulators:exec \
            --project demo-jade-cloud-save-gate41 \
            --config backend/cloud_save/firebase.json \
            --only auth,functions \
            'node backend/cloud_save/tests/emulator_integration.test.mjs'
