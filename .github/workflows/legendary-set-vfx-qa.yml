name: Legendary Set VFX QA
on:
  push:
    branches: ['checkpoint/**']
    paths: ['assets/effects/legendary_sets/**', 'scripts/player/legendary_set*', 'scripts/player/lin_yue_equipment_set_presentation.gd', 'scripts/effects/equipment_set_combat.gd', 'scripts/weapon/run_combat_ledger.gd', 'tests/legendary_set*', '.github/workflows/legendary-set-vfx-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python tests/legendary_set_asset_audit.py
      - name: Prepare isolated Godot import
        shell: bash
        run: |
          mkdir -p /tmp/jade-qa/project
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-qa/godot.zip
          unzip -q /tmp/jade-qa/godot.zip -d /tmp/jade-qa
          python - <<'PY'
          from pathlib import Path
          import re
          repo=Path.cwd(); qa=Path('/tmp/jade-qa/project')
          for name in ['assets','scripts','scenes','tests','backend','addons']:(qa/name).symlink_to(repo/name,target_is_directory=True)
          s=(repo/'project.godot').read_text()
          s=re.sub(r'\[editor_plugins\][\s\S]*?(?=\n\[|\Z)','[editor_plugins]\nenabled=PackedStringArray()\n',s)
          for folder in ['scripts','addons']:
              for p in (repo/folder).rglob('*.gd.uid'):
                  uid=p.read_text().strip()
                  if uid in s:s=s.replace(uid,'res://'+str(p.relative_to(repo)).removesuffix('.uid'))
          (qa/'project.godot').write_text(s)
          PY
          timeout 180 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --editor --import
      - name: Actual passive triggers and weapon report regression
        shell: bash
        run: |
          XDG_DATA_HOME=/tmp/jade_legendary_qa timeout 120 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --script res://tests/legendary_set_vfx_smoke.gd
          XDG_DATA_HOME=/tmp/jade_arsenal_qa_integration_legendary timeout 120 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --script res://tests/arsenal_integration_smoke.gd
