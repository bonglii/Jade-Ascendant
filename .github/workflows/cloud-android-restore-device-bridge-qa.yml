name: Jade Ascendant - Android Restore Device Bridge QA

on:
  push:
    branches:
      - 'qa/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-restore-device-bridge:
    name: Android Restore Device Bridge (NO APK / NO DEVICE)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fail-closed Android device bridge source boundary
        shell: pwsh
        run: |
          node --test backend/cloud_save/tests/android_restore_device_source_boundary.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Android restore device source boundary failed.' }

      - name: Audit disposable git-archive transform without Android export
        shell: pwsh
        run: |
          & ./tools/android_restore_device_qa.ps1 -Action Audit
          if ($LASTEXITCODE -ne 0) { throw 'Android restore device workspace audit failed.' }

      - name: Download and verify official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Official Godot binary SHA256 mismatch: $actualSha256" }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $godot = Join-Path $installDir 'Godot_v4.7.2-stable_win64_console.exe'
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version check failed.' }
          "JADE_ANDROID_BRIDGE_GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import production project resources
        shell: pwsh
        run: |
          & $env:JADE_ANDROID_BRIDGE_GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw 'Godot project import failed.' }

      - name: Parse Android QA bridge resources without running destructive QA
        shell: pwsh
        run: |
          $output = & $env:JADE_ANDROID_BRIDGE_GODOT --headless --path . --script res://tests/android/android_restore_device_parse_qa.gd 2>&1 | Out-String
          $output | Write-Host
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'JADE_ANDROID_RESTORE_DEVICE_PARSE_PASS') {
            throw 'Android restore device bridge parse QA failed.'
          }
