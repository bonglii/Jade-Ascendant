name: Jade Ascendant - Gate 5 Spark Economy Contract QA

on:
  push:
    branches:
      - 'qa/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate5-spark-reference:
    name: Gate 5 / Play V2 policy + ledger reference (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Node 22 without Firebase credentials
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Gate 5 source syntax (no external network)
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/cloud_save/functions/src/economy/product_catalog.mjs
          node --check backend/cloud_save/functions/src/economy/play_purchase_v2.mjs
          node --check backend/cloud_save/functions/src/economy/ledger_reference.mjs
          node --check backend/cloud_save/functions/src/economy/firestore_gate5_emulator_model.mjs
          node --check backend/cloud_save/tests/gate5_firestore_emulator.test.mjs
          node --check backend/cloud_save/tests/gate5_trusted_economy.test.mjs
          node --check backend/cloud_save/functions/src/snapshot/full_permanent_draft_v2.mjs
          node --check backend/cloud_save/functions/src/snapshot/firestore_gate6_emulator_model.mjs
          node --check backend/cloud_save/tests/gate6_full_permanent_draft.test.mjs
          node --check backend/cloud_save/tests/gate6_firestore_emulator.test.mjs

      - name: Run Play API V2 synthetic purchase and global dedupe invariants
        shell: bash
        run: |
          set -euo pipefail
          node --test backend/cloud_save/tests/gate5_trusted_economy.test.mjs

      - name: Gate 6 exact 8-domain contract and source drift QA (NO CLIENT TRANSFER)
        shell: bash
        run: |
          set -euo pipefail
          node --test backend/cloud_save/tests/gate6_full_permanent_draft.test.mjs

      - name: Recheck PRE_DEPLOYMENT_ONLY gate
        shell: bash
        run: |
          set -euo pipefail
          node --test backend/cloud_save/tests/predeploy_gate43.test.mjs

      - name: Java 21 for isolated Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase Admin SDK from reviewed lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend/cloud_save/functions ci --ignore-scripts --no-audit --no-fund

      - name: Exercise real Firestore transaction ledger against localhost DEMO emulator
        shell: bash
        env:
          JADE_GATE5_EMULATOR_ONLY: '1'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          GCLOUD_PROJECT: demo-jade-cloud-save-gate5
          GOOGLE_CLOUD_PROJECT: demo-jade-cloud-save-gate5
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.28.2 emulators:exec \
            --project demo-jade-cloud-save-gate5 \
            --config backend/cloud_save/firebase-gate5-emulator.json \
            --only firestore \
            'node --test backend/cloud_save/tests/gate5_firestore_emulator.test.mjs backend/cloud_save/tests/gate6_firestore_emulator.test.mjs'
