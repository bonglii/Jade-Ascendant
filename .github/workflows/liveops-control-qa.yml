name: LiveOps control desk
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['backend/**/heavenly_trials*', 'backend/player_identity/mail.mjs', 'backend/player_identity/mail.test.mjs', 'backend/player_identity/check_liveops_control.cjs', 'backend/player_identity/liveops_dashboard_syntax.test.mjs', 'backend/player_identity/liveops_control_release.test.mjs', 'backend/player_identity/deploy_*.ps1', 'backend/monetization/cloudflare/migrations/0017*', '.github/workflows/liveops-control-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node backend/player_identity/check_liveops_control.cjs
      - name: Bundle IAP source without deployment
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.0 deploy --dry-run --config backend/monetization/cloudflare/wrangler.production-live.toml --outdir /tmp/liveops-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liveops-control-qa-${{ github.run_id }}
          path: .local/liveops_control_qa/*.log
          retention-days: 14
  windows-launcher-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the actual Windows PowerShell launchers
        shell: powershell
        run: |
          foreach ($name in @('deploy_liveops_control.ps1','deploy_heavenly_trials.ps1','deploy_player_flow_batch.ps1','deploy_odyssey_shop.ps1','deploy_update_notifications.ps1','deploy_odyssey_flow.ps1')) {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ('backend/player_identity/'+$name)),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($name+': '+$errors[0].Message) }
          }
