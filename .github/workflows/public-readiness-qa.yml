name: Public release readiness
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['backend/player_identity/**', 'backend/monetization/cloudflare/wrangler.production-live.toml', 'scripts/managers/progress_backup*', 'scripts/debug/release_*', 'scripts/debug/build_metadata*', 'scripts/debug/DebugLogger.gd', 'scripts/ui/settings_screen.gd', 'addons/JadeReleaseMetadata/**', 'release/native/**', 'tests/public_readiness*', 'tests/fixtures/progress_backup*', 'project.godot', '.github/workflows/public-readiness-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test backend/player_identity/*.test.mjs
      - name: Bundle live IAP config without deploying
        env:
          CLOUDFLARE_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.0 deploy --dry-run --config backend/monetization/cloudflare/wrangler.production-live.toml --outdir /tmp/live-bundle
  windows-launchers:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse launchers with real Windows PowerShell
        run: |
          foreach ($name in @('export_production.ps1','deploy_public_readiness.ps1','publish_public_readiness.ps1')) {
            $tokens=$null; $errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ('backend/player_identity/'+$name)),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw ($name+': '+$errors[0].Message) }
          }
      - name: Verify native source pair without Godot, deployment or network
        run: |
          & backend/player_identity/export_production.ps1 -VerifyOnly
          if ($LASTEXITCODE -ne 0) { throw 'Production export preflight failed.' }
      - run: node --test backend/player_identity/production_release_contract.test.mjs
  godot-recovery-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Godot isolated save/recovery and mobile UI fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jade-public-qa/project
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-public-qa/godot.zip
          unzip -q /tmp/jade-public-qa/godot.zip -d /tmp/jade-public-qa
          python3 tests/setup_public_readiness_qa.py /tmp/jade-public-qa/project
          godot=/tmp/jade-public-qa/Godot_v4.7.2-stable_linux.x86_64
          timeout 180 "$godot" --headless --audio-driver Dummy --path /tmp/jade-public-qa/project --editor --import --quit >/tmp/public-import.log 2>&1
          for runner in public_readiness_smoke public_readiness_ui_smoke; do
            timeout 60 "$godot" --headless --audio-driver Dummy --path /tmp/jade-public-qa/project --script "res://tests/$runner.gd" >"/tmp/$runner.log" 2>&1
            cat "/tmp/$runner.log"
            if rg -n 'SCRIPT ERROR|^ERROR:' "/tmp/$runner.log"; then exit 1; fi
          done
          python3 tests/public_readiness_metadata_export.py "$godot"
