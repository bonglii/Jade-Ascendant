name: Player Identity and Mail Server QA
on:
  push:
    branches: ['checkpoint/**']
    paths: ['backend/player_identity/**', 'backend/monetization/cloudflare/src/jwt_verify.mjs', 'scripts/managers/player_identity*', '.github/workflows/player-identity-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test backend/player_identity/*.test.mjs
