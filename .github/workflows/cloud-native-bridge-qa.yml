name: Jade Ascendant - Cloud Native Bridge Build QA

on:
  push:
    branches:
      - 'qa/**'
    paths:
      - 'backend/cloud_save/android_bridge/**'
      - 'backend/cloud_save/tests/native_bridge_contract.test.mjs'
      - 'addons/JadeCloudNativeBridge/**'
      - '.github/workflows/cloud-native-bridge-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bridge-build:
    name: Gate 4.2 / isolated Android bridge compile (NO APP EXPORT)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4

      - name: Node source-policy regression
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fail-closed source policy QA
        run: node --test backend/cloud_save/tests/native_bridge_contract.test.mjs

      - name: Java 17 for Godot Android plugin build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        uses: android-actions/setup-android@v4

      - name: Install isolated Android compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup pinned Gradle 8.14.3 (no wrapper binary)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compile BOTH variants + test fail-closed Kotlin decoder
        run: |
          set -euo pipefail
          gradle -p backend/cloud_save/android_bridge \
            :bridge:assembleDebug :bridge:assembleRelease \
            :bridge:testDebugUnitTest :bridge:testReleaseUnitTest \
            --no-daemon --stacktrace

      - name: Verify release classpath excludes App Check debug provider
        run: |
          set -euo pipefail
          gradle -p backend/cloud_save/android_bridge \
            :bridge:dependencies --configuration releaseRuntimeClasspath \
            --no-daemon > "$RUNNER_TEMP/bridge-release-deps.txt"
          if grep -q 'firebase-appcheck-debug' "$RUNNER_TEMP/bridge-release-deps.txt"; then
            echo 'ERROR: debug provider leaked into RELEASE runtime classpath' >&2
            exit 1
          fi
          grep -q 'firebase-functions' "$RUNNER_TEMP/bridge-release-deps.txt"
          grep -q 'firebase-appcheck-playintegrity' "$RUNNER_TEMP/bridge-release-deps.txt"
          test -f backend/cloud_save/android_bridge/bridge/build/outputs/aar/JadeCloudNativeBridge-debug.aar
          test -f backend/cloud_save/android_bridge/bridge/build/outputs/aar/JadeCloudNativeBridge-release.aar

      - name: Resolve legacy + bridge Firebase dependencies (candidate compatibility QA)
        run: |
          set -euo pipefail
          gradle -p backend/cloud_save/android_bridge \
            :bridge:dependencies --configuration qaMergedFirebaseRuntime \
            --no-daemon > "$RUNNER_TEMP/qa-merged-dependencies.txt"
          grep -Fq 'com.google.firebase:firebase-auth:23.2.0 -> 24.2.0' "$RUNNER_TEMP/qa-merged-dependencies.txt"
          grep -Fq 'com.google.firebase:firebase-functions:22.1.1' "$RUNNER_TEMP/qa-merged-dependencies.txt"
          grep -Fq 'com.google.firebase:firebase-appcheck-playintegrity:19.4.1' "$RUNNER_TEMP/qa-merged-dependencies.txt"
          if grep -Fq 'firebase-appcheck-debug' "$RUNNER_TEMP/qa-merged-dependencies.txt"; then
            echo 'ERROR: debug App Check dependency leaked into QA release graph.' >&2
            exit 1
          fi
          echo 'Merged Firebase dependency graph resolved; device-level APK compatibility is still pending.'

      - name: Check packaged QA binary manifests and provider separation
        run: |
          set -euo pipefail
          for variant in debug release; do
            aar="addons/JadeCloudNativeBridge/bin/$variant/JadeCloudNativeBridge-$variant.aar"
            test -s "$aar"
            unzip -p "$aar" AndroidManifest.xml | grep -q 'org.godotengine.plugin.v2.JadeCloudNativeBridge'
            unzip -p "$aar" classes.jar > "$RUNNER_TEMP/qa-$variant-classes.jar"
            jar tf "$RUNNER_TEMP/qa-$variant-classes.jar" | grep -q 'cloudbridge/JadeCloudNativeBridge.class'
          done
          javap -classpath "$RUNNER_TEMP/qa-release-classes.jar" -c \
            com.yungdevstudio.jadeascendant.cloudbridge.AppCheckProviderInstall \
            > "$RUNNER_TEMP/qa-release-bytecode.txt"
          grep -Fq 'PlayIntegrityAppCheckProviderFactory' "$RUNNER_TEMP/qa-release-bytecode.txt"
          if grep -Fq 'DebugAppCheckProviderFactory' "$RUNNER_TEMP/qa-release-bytecode.txt"; then
            echo 'ERROR: release AAR contains debug provider bytecode.' >&2
            exit 1
          fi

      - name: Preserve QA-only native AARs for inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jade-cloud-native-gate42-${{ github.run_id }}
          path: backend/cloud_save/android_bridge/bridge/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 14
