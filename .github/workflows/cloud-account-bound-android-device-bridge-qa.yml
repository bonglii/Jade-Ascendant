name: Jade Ascendant - Android Account-Bound Transport Device Bridge QA

on:
  push:
    branches:
      - 'qa/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-account-bound-device-bridge:
    name: Android Account-Bound Transport Device Bridge (NO APK / NO DEVICE)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fail-closed Android account-bound device source boundary
        shell: pwsh
        run: |
          node --test backend/cloud_save/tests/android_account_bound_transport_device_source_boundary.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Android account-bound transport device source boundary failed.' }
          node --test backend/cloud_save/tests/android_account_bound_transport_device_fixture.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Android account-bound transport device fixture contract failed.' }

      - name: Parse PowerShell device harnesses before execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relativePath in @(
            './tools/android_account_bound_transport_device_qa.ps1',
            './tools/android_account_bound_transport_device_build_qa.ps1'
          )) {
            $parseTokens = $null
            $parseErrors = $null
            $scriptPath = (Resolve-Path $relativePath).Path
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath, [ref]$parseTokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -ne 0) {
              $parseErrors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              throw "PowerShell parser audit failed: $relativePath"
            }
          }
          Write-Host 'JADE_ANDROID_ACCOUNT_BOUND_TRANSPORT_POWERSHELL_PARSE_PASS'

      - name: Audit disposable git-archive transforms without APK or device
        shell: pwsh
        run: |
          & ./tools/android_account_bound_transport_device_qa.ps1 -Action Audit
          if ($LASTEXITCODE -ne 0) { throw 'Android account-bound transport device workspace audit failed.' }
          & ./tools/android_account_bound_transport_device_build_qa.ps1 -Action Audit
          if ($LASTEXITCODE -ne 0) { throw 'Android account-bound transport build harness audit failed.' }

      - name: Prove verified-export shutdown watcher with synthetic APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pwshPath = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          $watcherScript = (Resolve-Path './tools/android_account_bound_transport_device_build_qa.ps1').Path
          & $pwshPath -NoProfile -NonInteractive -File $watcherScript -Action ExportWatcherSelfTest
          $watcherExitCode = $LASTEXITCODE
          if ($watcherExitCode -ne 0) { throw "Android account-bound export watcher self-test failed. child_exit=$watcherExitCode" }

      - name: Download and verify official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Official Godot binary SHA256 mismatch: $actualSha256" }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $godot = Join-Path $installDir 'Godot_v4.7.2-stable_win64_console.exe'
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version check failed.' }
          "JADE_ANDROID_ACCOUNT_BOUND_GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reproduce disposable local-build import and plugin startup (NO APK)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeStdout = Join-Path $env:RUNNER_TEMP 'android-account-bound-build-smoke.stdout.log'
          $smokeStderr = Join-Path $env:RUNNER_TEMP 'android-account-bound-build-smoke.stderr.log'
          Remove-Item -LiteralPath $smokeStdout,$smokeStderr -Force -ErrorAction SilentlyContinue
          $pwshPath = (Get-Command pwsh -CommandType Application -ErrorAction Stop).Source
          $smokeScript = (Resolve-Path './tools/android_account_bound_transport_device_build_qa.ps1').Path
          $smokeArguments = @(
            '-NoProfile',
            '-NonInteractive',
            '-File', $smokeScript,
            '-Action', 'Smoke',
            '-GodotPath', $env:JADE_ANDROID_ACCOUNT_BOUND_GODOT,
            '-ImportTimeoutSeconds', '420',
            '-PluginSmokeTimeoutSeconds', '120'
          )
          & $pwshPath @smokeArguments 1> $smokeStdout 2> $smokeStderr
          $smokeExitCode = $LASTEXITCODE
          $outputParts = @()
          if (Test-Path -LiteralPath $smokeStdout -PathType Leaf) {
            $outputParts += [System.IO.File]::ReadAllText($smokeStdout)
          }
          if (Test-Path -LiteralPath $smokeStderr -PathType Leaf) {
            $outputParts += [System.IO.File]::ReadAllText($smokeStderr)
          }
          $output = ($outputParts -join [Environment]::NewLine)
          if ($output) { $output | Write-Host }
          if ($smokeExitCode -ne 0 -or $output -notmatch 'ANDROID_ACCOUNT_BOUND_TRANSPORT_BUILD_SMOKE_PASS') {
            throw "Disposable Android account-bound local-build smoke failed. child_exit=$smokeExitCode"
          }

      - name: Import production project resources
        shell: pwsh
        run: |
          & $env:JADE_ANDROID_ACCOUNT_BOUND_GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw 'Godot project import failed.' }

      - name: Parse Android account-bound device resources without running device QA
        shell: pwsh
        run: |
          $output = & $env:JADE_ANDROID_ACCOUNT_BOUND_GODOT --headless --path . --script res://tests/android/android_account_bound_transport_device_parse_qa.gd 2>&1 | Out-String
          $output | Write-Host
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'JADE_ANDROID_ACCOUNT_BOUND_TRANSPORT_PARSE_PASS') {
            throw 'Android account-bound transport device parse QA failed.'
          }
