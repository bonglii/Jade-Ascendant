name: IAP delivery boundaries
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['scripts/managers/pavilion_manager.gd', 'backend/**', 'addons/JadeMonetizationNativeBridge/**', 'tests/*publish*.ps1', 'tests/native_provenance_smoke.ps1', 'docs/checkpoints/IAP_DELIVERY_NATIVE.json', '.github/workflows/iap-delivery-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test backend/monetization/cloudflare/tests/*.test.mjs
  windows-powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./backend/player_identity/build_native_bridge.ps1 -SdkRoot $env:ANDROID_HOME -Target staging -SandboxCredit -GradlePath (Get-Command gradle.bat).Source
      - uses: actions/upload-artifact@v4
        with:
          name: iap-native-durable-recovery-candidate
          include-hidden-files: true
          path: |
            addons/JadeMonetizationNativeBridge/bin/**/*.aar
            .local/native_bridge_receipts/*.json
            backend/monetization/android_bridge/bridge/build/test-results/**/*.xml
      - run: ./tests/publish_json_compatibility_smoke.ps1
      - run: ./tests/publish_delivery_staging_smoke.ps1
      - run: ./tests/native_provenance_smoke.ps1
