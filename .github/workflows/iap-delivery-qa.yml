name: IAP delivery boundaries
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['scripts/managers/pavilion_manager.gd', 'scripts/monetization/paid_gameplay_v2.gd', 'scripts/ui/paid_armory_panel.gd', 'scripts/ui/equipment_manager.gd', 'scripts/ui/hero_unified_screen.gd', 'scripts/ui/pavilion_sanctum_screen.gd', 'tests/paid_gameplay_v2_smoke.gd', 'tests/fixtures/paid_gameplay_manager_v2.gd', 'scripts/ui/mobile_touch_presentation_guard.gd', 'scripts/ui/liveops/celestial_treasury_screen.gd', 'scripts/weapon/weapon_manager.gd', 'scripts/managers/inventory_manager.gd', 'scripts/managers/live_ops_manager.gd', 'backend/**', 'addons/JadeMonetizationNativeBridge/**', 'tests/*publish*.ps1', 'tests/native_provenance_smoke.ps1', 'docs/checkpoints/IAP_DELIVERY_NATIVE.json', '.github/workflows/iap-delivery-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test backend/monetization/cloudflare/tests/*.test.mjs
  windows-powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./backend/player_identity/build_native_bridge.ps1 -SdkRoot $env:ANDROID_HOME -Target staging -SandboxCredit -GameplayV2 -GradlePath (Get-Command gradle.bat).Source
      - uses: actions/upload-artifact@v4
        with:
          name: iap-native-durable-recovery-candidate
          include-hidden-files: true
          path: |
            addons/JadeMonetizationNativeBridge/bin/**/*.aar
            .local/native_bridge_receipts/*.json
            backend/monetization/android_bridge/bridge/build/test-results/**/*.xml
      - run: ./tests/publish_json_compatibility_smoke.ps1
      - run: ./tests/publish_delivery_staging_smoke.ps1
      - run: ./tests/native_provenance_smoke.ps1
  godot-paid-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Godot import
        shell: bash
        run: |
          mkdir -p /tmp/jade-qa/project
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-qa/godot.zip
          unzip -q /tmp/jade-qa/godot.zip -d /tmp/jade-qa
          python - <<'PY'
          from pathlib import Path
          import re
          repo=Path.cwd(); qa=Path('/tmp/jade-qa/project')
          for name in ['assets','scripts','scenes','tests','backend','addons']:(qa/name).symlink_to(repo/name,target_is_directory=True)
          s=(repo/'project.godot').read_text()
          s=re.sub(r'\[editor_plugins\][\s\S]*?(?=\n\[|\Z)','[editor_plugins]\nenabled=PackedStringArray()\n',s)
          for folder in ['scripts','addons']:
              for p in (repo/folder).rglob('*.gd.uid'):
                  uid=p.read_text().strip()
                  if uid in s:s=s.replace(uid,'res://'+str(p.relative_to(repo)).removesuffix('.uid'))
          (qa/'project.godot').write_text(s)
          PY
          timeout 180 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --editor --import
      - name: Paid client boundaries and affected equipment UI
        shell: bash
        run: |
          set -euo pipefail
          for spec in 'paid_gameplay_v2_smoke:jade_paid_v2_qa' 'iap_delivery_boundary_smoke:jade_iap_boundary_qa' 'server_jade_delivery_smoke:jade_server_delivery_qa' 'hero_equipment_progression_smoke:jade_hero_qa' 'hero_upgrade_burst_smoke:jade_hero_qa_burst' 'pavilion_sanctum_smoke:jade_gacha_qa'; do
            test_name="${spec%%:*}"
            qa_home="${spec#*:}"
            XDG_DATA_HOME="/tmp/$qa_home" timeout 120 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --script "res://tests/$test_name.gd" 2>&1 | tee "/tmp/$test_name.log"
            ! rg 'ERROR:|SCRIPT ERROR:' "/tmp/$test_name.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iap-paid-client-checks
          path: /tmp/*smoke.log
