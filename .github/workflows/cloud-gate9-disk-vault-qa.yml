name: Jade Ascendant - Gate 9 Local Safety QA

on:
  push:
    branches:
      - 'qa/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate9-real-file-vault:
    name: Gate 9A-B / disk vault + write barrier (NO RESTORE)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Setup Node.js 22 for Gate 9 source boundary audit
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fail-closed source boundary tests (no real player files)
        shell: pwsh
        run: |
          node --test backend/cloud_save/tests/gate9_disk_vault_source_boundary.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Gate 9 source boundary failed.' }

      - name: Download and verify official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Official Godot binary SHA256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $godot = Join-Path $installDir 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Godot console executable not found."
          }
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version check failed.' }
          "JADE_GATE9_GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import project resources on disposable CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:JADE_GATE9_GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw "Gate 9 project import failed: $LASTEXITCODE" }

      - name: Run Godot real file-vault QA against disposable synthetic user namespace
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # Standalone Godot headless runner on ephemeral Actions VM only.
          # Every fixture path is user://jade_gate9_qa/, not any game save.
          & $env:JADE_GATE9_GODOT --headless --path . --script 'res://tests/gate9_disk_vault_qa.gd'
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 9 real-file QA failed: exit $LASTEXITCODE"
          }

      - name: Run Gate 9B SaveManager write barrier and process-restart QA
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # Two separate Godot processes share only the disposable runner's user://.
          # The first intentionally exits while the runtime-only barrier is held.
          $env:JADE_GATE9B_STAGE = 'arm'
          & $env:JADE_GATE9_GODOT --headless --path . --script 'res://tests/gate9_write_barrier_qa.gd'
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 9B barrier arm stage failed: exit $LASTEXITCODE"
          }
          $env:JADE_GATE9B_STAGE = 'verify'
          & $env:JADE_GATE9_GODOT --headless --path . --script 'res://tests/gate9_write_barrier_qa.gd'
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 9B restart verification failed: exit $LASTEXITCODE"
          }
