name: Jade Ascendant - Gate 9 Local Safety QA

on:
  push:
    branches:
      - 'qa/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate9-real-file-vault:
    name: Gate 9 / vault + barrier + transactional restore sandbox (NO PRODUCTION RESTORE)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Setup Node.js 22 for Gate 9 source boundary audit
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Fail-closed source boundary tests (no real player files)
        shell: pwsh
        run: |
          node --test backend/cloud_save/tests/gate9_disk_vault_source_boundary.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Gate 9 source boundary failed.' }
          node --test backend/cloud_save/tests/restore_transaction_source_boundary.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Transactional restore source boundary failed.' }

      - name: Download and verify official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Official Godot binary SHA256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $godot = Join-Path $installDir 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) {
            throw "Godot console executable not found."
          }
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version check failed.' }
          "JADE_GATE9_GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import project resources on disposable CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:JADE_GATE9_GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw "Gate 9 project import failed: $LASTEXITCODE" }

      - name: Run Godot real file-vault QA against disposable synthetic user namespace
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:JADE_GATE9_GODOT --headless --path . --script 'res://tests/gate9_disk_vault_qa.gd'
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 9 real-file QA failed: exit $LASTEXITCODE"
          }

      - name: Run Gate 9B SaveManager write barrier and process-restart QA
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JADE_GATE9B_STAGE = 'arm'
          & $env:JADE_GATE9_GODOT --headless --path . --script 'res://tests/gate9_write_barrier_qa.gd'
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 9B barrier arm stage failed: exit $LASTEXITCODE"
          }
          $env:JADE_GATE9B_STAGE = 'verify'
          & $env:JADE_GATE9_GODOT --headless --path . --script 'res://tests/gate9_write_barrier_qa.gd'
          if ($LASTEXITCODE -ne 0) {
            throw "Gate 9B restart verification failed: exit $LASTEXITCODE"
          }

      - name: Run transactional restore apply rollback and confirmation restart QA
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'res://tests/restore_transaction_restart_qa.gd'
          foreach ($stage in @('apply_for_rollback','rollback_after_restart','apply_for_confirm','confirm_after_restart')) {
            $env:JADE_RESTORE_TX_STAGE = $stage
            $env:JADE_RESTORE_TX_FAULT = ''
            $env:JADE_RESTORE_TX_RECOVERY_FAULT = ''
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Restore transaction stage failed: $stage ($LASTEXITCODE)" }
          }

      - name: Run transactional restore commit crash matrix
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'res://tests/restore_transaction_restart_qa.gd'
          $domains = @('achievements','daily_quests','equipment','idle_cultivation','inventory','journey','pavilion','progression')
          $faults = @('after_intent','after_commit_marker')
          foreach ($domain in $domains) {
            $faults += "after_tmp:$domain"
            $faults += "after_primary_to_rollback:$domain"
            $faults += "after_candidate_to_primary:$domain"
            $faults += "after_domain:$domain"
          }
          $faults += 'after_all_domains'
          $faults += 'after_applied_marker'
          foreach ($fault in $faults) {
            $env:JADE_RESTORE_TX_STAGE = 'fault'
            $env:JADE_RESTORE_TX_FAULT = $fault
            $env:JADE_RESTORE_TX_RECOVERY_FAULT = ''
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Restore fault arm failed: $fault ($LASTEXITCODE)" }
            $env:JADE_RESTORE_TX_STAGE = 'recover'
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Restore restart recovery failed: $fault ($LASTEXITCODE)" }
          }

      - name: Run interrupted rollback recovery matrix
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'res://tests/restore_transaction_restart_qa.gd'
          $rollbackFaults = @(
            'rollback_after_tmp:achievements',
            'rollback_after_target_to_discard:achievements',
            'rollback_after_preimage_to_primary:achievements',
            'rollback_after_cleanup:achievements',
            'rollback_after_tmp:inventory',
            'rollback_after_target_to_discard:inventory',
            'rollback_after_preimage_to_primary:inventory',
            'rollback_after_cleanup:inventory',
            'rollback_after_tmp:progression',
            'rollback_after_target_to_discard:progression',
            'rollback_after_preimage_to_primary:progression',
            'rollback_after_cleanup:progression'
          )
          foreach ($rollbackFault in $rollbackFaults) {
            # First process dies with the first primary moved aside, guaranteeing
            # recovery must choose the whole-account rollback path.
            $env:JADE_RESTORE_TX_STAGE = 'fault'
            $env:JADE_RESTORE_TX_FAULT = 'after_primary_to_rollback:achievements'
            $env:JADE_RESTORE_TX_RECOVERY_FAULT = ''
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Rollback setup fault failed: $rollbackFault ($LASTEXITCODE)" }

            # Second process is itself interrupted during rollback.
            $env:JADE_RESTORE_TX_STAGE = 'recover_fault'
            $env:JADE_RESTORE_TX_RECOVERY_FAULT = $rollbackFault
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Rollback injected fault failed: $rollbackFault ($LASTEXITCODE)" }

            # Third process must deterministically finish with no mixed state.
            $env:JADE_RESTORE_TX_STAGE = 'recover'
            $env:JADE_RESTORE_TX_RECOVERY_FAULT = ''
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Rollback restart recovery failed: $rollbackFault ($LASTEXITCODE)" }
          }

      - name: Run interrupted manual rollback after applied-state matrix
        shell: pwsh
        env:
          JADE_GATE9_TEST_ONLY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'res://tests/restore_transaction_restart_qa.gd'
          $faults = @(
            'rollback_after_target_to_discard:achievements',
            'rollback_after_preimage_to_primary:inventory',
            'rollback_after_cleanup:progression'
          )
          foreach ($fault in $faults) {
            $env:JADE_RESTORE_TX_STAGE = 'manual_rollback_fault'
            $env:JADE_RESTORE_TX_FAULT = ''
            $env:JADE_RESTORE_TX_RECOVERY_FAULT = $fault
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Manual rollback injected fault failed: $fault ($LASTEXITCODE)" }

            $env:JADE_RESTORE_TX_STAGE = 'recover'
            $env:JADE_RESTORE_TX_RECOVERY_FAULT = ''
            & $env:JADE_GATE9_GODOT --headless --path . --script $runner
            if ($LASTEXITCODE -ne 0) { throw "Manual rollback restart recovery failed: $fault ($LASTEXITCODE)" }
          }
