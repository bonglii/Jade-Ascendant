name: Release comfort batch
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['scripts/data/weapon_reach.gd', 'scripts/weapon/**', 'scripts/managers/announcement_center.gd', 'scripts/managers/server_mail_manager.gd', 'scripts/managers/audio_manager.gd', 'scripts/managers/pavilion_manager.gd', 'scripts/ui/home_sanctuary_presenter.gd', 'scripts/ui/reward_claim_result_presenter.gd', 'backend/player_identity/**', 'tests/*comfort*', 'tests/ascendant_arsenal_smoke.gd', 'tests/compass_pursuit_smoke.gd', '.github/workflows/release-comfort-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changed-flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Server, announcement policy and nine existing production gates
        run: |
          node --test --test-concurrency=1 backend/player_identity/announcements.test.mjs backend/player_identity/odyssey_dashboard.test.mjs backend/player_identity/heavenly_trials.test.mjs backend/player_identity/liveops_dashboard_syntax.test.mjs backend/player_identity/studio_version.test.mjs
          node backend/player_identity/production_release_contract.mjs
      - name: Admin event pause, drafts and consistent fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/jade-dom" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          NODE_PATH="$RUNNER_TEMP/jade-dom/node_modules" node tests/release_comfort_dashboard.cjs
      - name: Actual game logic and extended weapon hits
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/jade-comfort
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-comfort/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/jade-comfort/godot.zip' | sha256sum --check
          unzip -q /tmp/jade-comfort/godot.zip -d /tmp/jade-comfort
          node tests/check_release_comfort.cjs "$PWD" /tmp/jade-comfort/Godot_v4.7.2-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-comfort-${{ github.sha }}
          path: .local/release_comfort_qa/*.*
          if-no-files-found: error
          retention-days: 14
  windows-profile-preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse the exact Profile deploy script and validate without deploy
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'backend/player_identity/deploy_release_comfort.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          git checkout -B checkpoint/iap-fasttrack-20261010
          $config=Join-Path $PWD 'backend/player_identity/wrangler.local.toml'
          $text='name = "jade-ascendant-player"'+"`n"+'main = "worker.mjs"'+"`n"+'database_id = "1089de95-8cdc-447d-a9e3-9e743d200cba"'
          [IO.File]::WriteAllText($config,$text)
          & backend/player_identity/deploy_release_comfort.ps1 -ExpectedCommit $env:GITHUB_SHA -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Valid preflight failed' }
          [IO.File]::WriteAllText($config,$text.Replace('jade-ascendant-player','wrong-worker'))
          & backend/player_identity/deploy_release_comfort.ps1 -ExpectedCommit $env:GITHUB_SHA -ValidateOnly
          if ($LASTEXITCODE -eq 0) { throw 'Wrong target accepted' }
          Remove-Item -LiteralPath $config
          $global:LASTEXITCODE=0
          Write-Host 'COMFORT_WINDOWS_PREFLIGHT=PASS; DEPLOY=NONE'
      - name: Windows PowerShell stderr and exit-code regression
        shell: powershell
        run: |
          & tests/comfort_deploy_native.ps1 -Project $PWD
          if ($LASTEXITCODE -ne 0) { throw 'Native stderr contract failed' }
