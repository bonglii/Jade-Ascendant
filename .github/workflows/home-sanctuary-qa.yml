name: Home Sanctuary QA
on:
  push:
    branches: ['checkpoint/**']
    paths: ['scenes/ui/main_menu.tscn', 'scenes/ui/home_production_overlay.tscn', 'assets/ui/home/sanctuary/**', 'scripts/ui/home_sanctuary*', 'scripts/ui/wuxia_hub_nav.gd', 'scripts/ui/hub_resource_bar_manager.gd', 'tests/home_sanctuary*', 'backend/player_identity/*home_sanctuary*', '.github/workflows/home-sanctuary-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Godot import
        shell: bash
        run: |
          mkdir -p /tmp/jade-qa/project
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-qa/godot.zip
          unzip -q /tmp/jade-qa/godot.zip -d /tmp/jade-qa
          python - <<'PY'
          from pathlib import Path
          import re
          repo=Path.cwd(); qa=Path('/tmp/jade-qa/project')
          for name in ['assets','scripts','scenes','tests','backend','addons']:(qa/name).symlink_to(repo/name,target_is_directory=True)
          s=(repo/'project.godot').read_text()
          s=re.sub(r'\[editor_plugins\][\s\S]*?(?=\n\[|\Z)','[editor_plugins]\nenabled=PackedStringArray()\n',s)
          for folder in ['scripts','addons']:
              for p in (repo/folder).rglob('*.gd.uid'):
                  uid=p.read_text().strip()
                  if uid in s:s=s.replace(uid,'res://'+str(p.relative_to(repo)).removesuffix('.uid'))
          (qa/'project.godot').write_text(s)
          PY
          timeout 180 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --editor --import --quit
      - name: Home layout, ownership and navigation
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME=/tmp/jade_home_sanctuary_qa timeout 100 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --script res://tests/home_sanctuary_smoke.gd 2>&1 | tee /tmp/home.log
          ! grep -E 'ERROR:|SCRIPT ERROR:' /tmp/home.log
  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scoped PowerShell launchers
        shell: powershell
        run: |
          foreach ($name in @('apply_home_sanctuary','publish_home_sanctuary')) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ('backend/player_identity/' + $name + '.ps1')), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
