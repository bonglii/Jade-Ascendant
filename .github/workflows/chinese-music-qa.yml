name: Approved Chinese music
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['assets/audio/chinese_music/**', 'scripts/managers/audio_manager.gd', 'tests/chinese_music*', '.github/workflows/chinese-music-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real loop playback, menu continuity and existing gates
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/jade-audio"
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/jade-audio/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/jade-audio/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/jade-audio/godot.zip" -d "$RUNNER_TEMP/jade-audio"
          node tests/chinese_music_qa.cjs "$RUNNER_TEMP/jade-audio/Godot_v4.7.2-stable_linux.x86_64"
          node backend/player_identity/production_release_contract.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinese-music-${{ github.sha }}
          path: .local/chinese_music_qa/*.log
          if-no-files-found: error
          retention-days: 14
