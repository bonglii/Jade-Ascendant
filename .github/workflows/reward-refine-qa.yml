name: Reward and Refine QA
on:
  push:
    branches: ['checkpoint/**']
    paths: ['scripts/ui/*reward*', 'scripts/ui/refine_onboarding*', 'scripts/ui/hero_unified_screen.gd', 'scripts/ui/hub_resource_bar_manager.gd', 'scripts/managers/inventory_manager.gd', 'scripts/managers/reward_manager.gd', 'scripts/managers/pavilion_manager.gd', 'backend/player_identity/*reward*', 'backend/player_identity/dashboard.mjs', 'tests/reward_refine*', '.github/workflows/reward-refine-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test backend/player_identity/reward_retirement.test.mjs backend/player_identity/mail.test.mjs backend/player_identity/pavilion.test.mjs backend/player_identity/announcements.test.mjs backend/player_identity/identity.test.mjs
      - name: Prepare isolated Godot import
        shell: bash
        run: |
          mkdir -p /tmp/jade-qa/project
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-qa/godot.zip
          unzip -q /tmp/jade-qa/godot.zip -d /tmp/jade-qa
          python - <<'PY'
          from pathlib import Path
          import re
          repo=Path.cwd(); qa=Path('/tmp/jade-qa/project')
          for name in ['assets','scripts','scenes','tests','backend','addons']:(qa/name).symlink_to(repo/name,target_is_directory=True)
          s=(repo/'project.godot').read_text()
          s=re.sub(r'\[editor_plugins\][\s\S]*?(?=\n\[|\Z)','[editor_plugins]\nenabled=PackedStringArray()\n',s)
          for folder in ['scripts','addons']:
              for p in (repo/folder).rglob('*.gd.uid'):
                  uid=p.read_text().strip()
                  if uid in s:s=s.replace(uid,'res://'+str(p.relative_to(repo)).removesuffix('.uid'))
          (qa/'project.godot').write_text(s)
          PY
          timeout 180 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --editor --import
      - name: Reward migration, layout and upgrade guards
        shell: bash
        run: |
          set -o pipefail
          XDG_DATA_HOME=/tmp/jade_reward_refine_qa timeout 120 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --script res://tests/reward_refine_smoke.gd 2>&1 | tee /tmp/reward.log
          ! rg 'ERROR:|SCRIPT ERROR:' /tmp/reward.log
          XDG_DATA_HOME=/tmp/jade_hero_qa_reward timeout 120 /tmp/jade-qa/Godot_v4.7.2-stable_linux.x86_64 --headless --audio-driver Dummy --path /tmp/jade-qa/project --script res://tests/hero_upgrade_burst_smoke.gd 2>&1 | tee /tmp/upgrade.log
          ! rg 'ERROR:|SCRIPT ERROR:' /tmp/upgrade.log
  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scoped PowerShell launchers
        shell: powershell
        run: |
          foreach ($name in @('apply_reward_refine','publish_reward_refine','deploy_reward_refine')) {
            $tokens = $null; $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD ('backend/player_identity/' + $name + '.ps1')), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
