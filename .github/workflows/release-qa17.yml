name: Release QA17 / Mobile regression closure
on:
  push:
    branches: ['checkpoint/iap-fasttrack-20261010']
    paths: ['scripts/companion/**', 'scripts/ui/**', 'scripts/player/PlayerHealth.gd', 'scripts/managers/*quest*.gd', 'scripts/managers/achievement_manager.gd', 'scripts/managers/cultivation_mastery_manager.gd', 'scripts/monetization/paid_gameplay_v2.gd', 'tests/*smoke.gd', 'backend/player_identity/check_release_ui.cjs', '.github/workflows/release-qa17.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Official pinned engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p /tmp/jade-qa17
          curl -fsSL --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/jade-qa17/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/jade-qa17/godot.zip' | sha256sum --check
          unzip -q /tmp/jade-qa17/godot.zip -d /tmp/jade-qa17
      - name: Existing production contract and focused regressions
        run: |
          node backend/player_identity/production_release_contract.mjs
          node backend/player_identity/check_release_ui.cjs "$PWD" /tmp/jade-qa17/Godot_v4.7.2-stable_linux.x86_64
      - name: Native first swipes and compact layouts
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a node backend/player_identity/check_release_ui.cjs "$PWD" /tmp/jade-qa17/Godot_v4.7.2-stable_linux.x86_64 --native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa17-${{ github.sha }}
          path: |
            .local/release_qa17_qa/*.log
            .local/release_qa17_qa/*.json
            .local/event_touch_qa/import.log
          if-no-files-found: error
          retention-days: 14
