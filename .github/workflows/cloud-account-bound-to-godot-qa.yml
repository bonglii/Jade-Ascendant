name: Jade Ascendant - Account-Bound Transport to Godot Candidate QA

on:
  push:
    branches:
      - 'qa/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-transport-record:
    name: Emulator current snapshot -> immutable transport artifact (QA ONLY)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Node 22 without Firebase credentials
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Source syntax and bridge boundary audit
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/cloud_save/tests/export_account_bound_transport_fixture_qa.mjs
          node --check backend/cloud_save/tests/account_bound_transport_to_godot_source_boundary.test.mjs
          node --test backend/cloud_save/tests/account_bound_transport_to_godot_source_boundary.test.mjs

      - name: Java 21 for isolated Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase Admin SDK from reviewed lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix backend/cloud_save/functions ci --ignore-scripts --no-audit --no-fund

      - name: Export exact current account-bound record from localhost DEMO emulator
        shell: bash
        env:
          JADE_GATE5_EMULATOR_ONLY: '1'
          FIRESTORE_EMULATOR_HOST: '127.0.0.1:8080'
          GCLOUD_PROJECT: demo-jade-cloud-save-gate5
          GOOGLE_CLOUD_PROJECT: demo-jade-cloud-save-gate5
        run: |
          set -euo pipefail
          rm -rf qa_artifacts
          mkdir -p qa_artifacts
          npx --yes firebase-tools@15.28.2 emulators:exec \
            --project demo-jade-cloud-save-gate5 \
            --config backend/cloud_save/firebase-gate5-emulator.json \
            --only firestore \
            'node backend/cloud_save/tests/export_account_bound_transport_fixture_qa.mjs'
          test -s qa_artifacts/account_bound_transport_record.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('qa_artifacts/account_bound_transport_record.json','utf8')); if(x.code!=='QA_ACCOUNT_BOUND_CURRENT_SNAPSHOT_READY'||x.revision!==2||x.domain_count!==8||x.restore_allowed!==false||x.cloud_mutation_enabled!==false) process.exit(1);"

      - name: Upload synthetic transport record for isolated Godot consumer
        uses: actions/upload-artifact@v4
        with:
          name: account-bound-transport-record
          path: qa_artifacts/account_bound_transport_record.json
          if-no-files-found: error
          retention-days: 1

  godot-candidate-staging:
    name: Transport artifact -> Godot isolated candidates (NO RESTORE)
    needs: emulator-transport-record
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      JADE_ACCOUNT_BOUND_TO_GODOT_TEST_ONLY: '1'
      JADE_ACCOUNT_BOUND_TO_GODOT_ACK: 'DISPOSABLE_RUNNER_ONLY'
      JADE_CONTROLLED_TRANSFER_TEST_ONLY: '1'
      JADE_CONTROLLED_TRANSFER_ACK: 'DISPOSABLE_RUNNER_ONLY'
    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Download exact synthetic transport artifact
        uses: actions/download-artifact@v4
        with:
          name: account-bound-transport-record
          path: qa_artifacts

      - name: Verify artifact scope before Godot reads it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $record = Join-Path $PWD 'qa_artifacts\account_bound_transport_record.json'
          if (-not (Test-Path -LiteralPath $record -PathType Leaf)) { throw 'Transport record artifact missing.' }
          $files = @(Get-ChildItem -LiteralPath (Join-Path $PWD 'qa_artifacts') -File -Recurse)
          if ($files.Count -ne 1) { throw "Unexpected transport artifact file count: $($files.Count)" }
          if ($files[0].Name -ne 'account_bound_transport_record.json') { throw 'Unexpected transport artifact file.' }
          if ($files[0].Length -le 0 -or $files[0].Length -gt 614400) { throw "Transport artifact size invalid: $($files[0].Length)" }

      - name: Download and verify official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Official Godot binary SHA256 mismatch: $actualSha256" }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $godot = Join-Path $installDir 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) { throw 'Godot console executable not found.' }
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version check failed.' }
          "JADE_ACCOUNT_BOUND_TO_GODOT_GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import production project resources
        shell: pwsh
        run: |
          & $env:JADE_ACCOUNT_BOUND_TO_GODOT_GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw "Transport-to-Godot project import failed: $LASTEXITCODE" }

      - name: Decode server record and stage isolated candidate files only
        shell: pwsh
        run: |
          & $env:JADE_ACCOUNT_BOUND_TO_GODOT_GODOT --headless --path . --script res://tests/account_bound_transport_to_candidate_qa.gd
          if ($LASTEXITCODE -ne 0) { throw "Account-bound transport-to-candidate QA failed: $LASTEXITCODE" }
