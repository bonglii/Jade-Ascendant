name: Jade Ascendant - Cloud Restore UX Integration QA

on:
  push:
    branches:
      - 'qa/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-ux-integration:
    name: E3A Safe Presenter -> Explicit Godot Modal Controls (QA ONLY)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      JADE_RESTORE_UX_TEST_ONLY: '1'
      JADE_RESTORE_UX_ACK: 'DISPOSABLE_RUNNER_ONLY'
      JADE_RESTORE_UX_INTEGRATION_TEST_ONLY: '1'
      JADE_RESTORE_UX_INTEGRATION_ACK: 'DISPOSABLE_RUNNER_ONLY'

    steps:
      - name: Checkout exact QA revision
        uses: actions/checkout@v4

      - name: Setup Node.js 22 for source-boundary audit
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify E3B stays presentation-only above locked E3A
        shell: pwsh
        run: |
          node --test backend/cloud_save/tests/cloud_restore_ux_integration_source_boundary.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Cloud restore UX integration source boundary failed.' }

      - name: Download and verify official Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          $expectedSha256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          $installDir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "Official Godot binary SHA256 mismatch: $actualSha256" }
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $godot = Join-Path $installDir 'Godot_v4.7.2-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $godot -PathType Leaf)) { throw 'Godot console executable not found.' }
          & $godot --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot version check failed.' }
          "JADE_RESTORE_UX_INTEGRATION_GODOT=$godot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import production project resources
        shell: pwsh
        run: |
          & $env:JADE_RESTORE_UX_INTEGRATION_GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw "Restore UX integration project import failed: $LASTEXITCODE" }

      - name: Prove explicit restore modal state and command emission without execution authority
        shell: pwsh
        run: |
          $output = & $env:JADE_RESTORE_UX_INTEGRATION_GODOT --headless --path . --script res://tests/cloud_restore_ux_integration_qa.gd 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0 -or $output -notmatch 'JADE_CLOUD_RESTORE_UX_INTEGRATION_QA_PASS') {
            throw "Cloud restore UX integration QA failed: $code"
          }
